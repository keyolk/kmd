[package]
name = "kmd"
version = "0.1.0"
edition = "2024"
description = "Korean-aware markdown search — qmd-compatible CLI with lindera ko-dic BM25, vector search, and a warm daemon"
license = "MIT"

[features]
default = []
# 임베딩/벡터 검색 (llama.cpp 빌드가 무거워 opt-in)
embed = ["dep:llama-cpp-2"]

[dependencies]
# 검색 코어 — lindera-tantivy 2.0은 tantivy ^0.25 + lindera ^2.0을 요구
tantivy = "0.25"
lindera = { version = "2.0", features = ["embed-ko-dic"] }
lindera-tantivy = "2.0"

# 문서 스토어
rusqlite = { version = "0.37", features = ["bundled"] }

# 임베딩 (GGUF — 기존 qmd 모델 재활용)
llama-cpp-2 = { version = "0.1", optional = true }

# CLI / 직렬화 / 설정
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# 파일 스캔 / 해시
globset = "0.4"
walkdir = "2"
sha2 = "0.10"

# 에러
anyhow = "1"

# TUI (kmd sim)
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
lto = true
strip = true
